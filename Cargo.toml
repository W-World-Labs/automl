[workspace]
members = [
    "crates/automl-core",
    "crates/automl-server",
    "crates/automl-cli",
]
resolver = "2"

[workspace.package]
version = "2.0.0-alpha.5"
edition = "2021"
license = "MIT"

[workspace.dependencies]
automl-core = { path = "crates/automl-core" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
axum = "0.8"
# The public W-ID axum adapter exposes the axum-extra 0.12 CookieJar API.
axum-extra = { version = "0.12", features = ["cookie"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "compression-gzip", "timeout", "limit"] }
tower_governor = { version = "0.8", default-features = false, features = ["axum"] }
governor = "0.10"
sqlx = { version = "0.9", features = ["runtime-tokio", "postgres", "chrono", "uuid", "migrate", "json"] }
w-storage = { version = "=0.1.5", git = "https://github.com/W-World-Labs/w-commons", rev = "f7eb2a85af8409340d094807c22ab7f24cf50913", default-features = false, features = ["presign", "s3"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
rand = "0.8"
rand_core = "0.6"
base64 = "0.22"
http = "1"
ed25519-dalek = { version = "2", features = ["rand_core", "std"] }
tracing = "0.1"
dotenvy = "0.15"
utoipa = { version = "5", features = ["chrono", "uuid"] }
utoipa-axum = "0.2"
clap = { version = "4", features = ["derive", "env"] }
# rustls-only per fleet mandate — never enable native-tls.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

# Reviewed immutable public W components
w-web-kit = { version = "=0.1.10", git = "https://github.com/W-World-Labs/w-commons", rev = "f7eb2a85af8409340d094807c22ab7f24cf50913", default-features = false, features = ["health", "openapi", "cors", "error", "request-id", "shutdown", "spa"] }
w-http = { version = "=0.2.1", git = "https://github.com/W-World-Labs/w-commons", rev = "f7eb2a85af8409340d094807c22ab7f24cf50913", features = ["blocking"] }
w-crypto = { version = "=0.1.1", git = "https://github.com/W-World-Labs/w-commons", rev = "f7eb2a85af8409340d094807c22ab7f24cf50913", default-features = false, features = ["hash", "ct", "hmac", "hex"] }
w-task = { version = "=0.1.0", git = "https://github.com/W-World-Labs/w-commons", rev = "f7eb2a85af8409340d094807c22ab7f24cf50913" }
w-util = { version = "=0.1.3", git = "https://github.com/W-World-Labs/w-commons", rev = "f7eb2a85af8409340d094807c22ab7f24cf50913", features = ["text", "time"] }
w-id-axum = { version = "=0.3.0", git = "https://github.com/W-World-Labs/w-commons", rev = "f7eb2a85af8409340d094807c22ab7f24cf50913" }
w-id-sdk = { version = "=1.3.86", git = "https://github.com/W-World-Labs/w-id-sdk", rev = "4b9ae277f5a96b34469ccd3b6a9a62c5df699e32" }
xradar = { version = "=0.3.11", git = "https://github.com/W-World-Labs/w-radar", rev = "579174832c5de9a1b606f82084171b3965deae56", features = ["axum"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

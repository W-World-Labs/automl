# ╔══════════════════════════════════════════════════════════════════╗
# ║  Auto.ml — reproduce.yaml                                      ║
# ║  GENESIS-001: Platform Genesis Paper                            ║
# ║  Includes a demonstration experiment for template learning.     ║
# ╚══════════════════════════════════════════════════════════════════╝

# ── Metadata ──────────────────────────────────────────────────────
paper_id: "GENESIS-001"
title: "Auto: An Open Platform for Autonomous In-Silico Scientific Research"
journal_slug: "auto"
paper_type: "research"
authors:
  - name: "W Intelligence Lab"
    type: human
    orcid: "0000-0001-0000-0001"
    role: corresponding_author

# ── Research Chain (Sustainable Research) ────────────────────────
# If this paper builds upon a prior Auto.ml paper, declare it here.
# The Reproducer will fetch the parent, reproduce it first, then
# apply your diff to verify your improvements against the exact baseline.
# GENESIS-001 is a root paper — no parent.
# extends:
#   parent_paper_id: "AUTO-2026-XXXX"   # parent paper ID
#   parent_version: "v1.0"              # pinned version
#   diff_file: "changes.patch"          # unified diff (git diff)
#   inherit:
#     - code          # inherit parent's codebase
#     - datasets      # reuse parent's datasets
#     - environment   # extend parent's pyproject.toml

# ── Runtime ───────────────────────────────────────────────────────
runtime:
  python: "3.12"
  package_manager: "uv"
  bootstrap: "uv sync"

# ── Environment Lock ─────────────────────────────────────────────
lockfile:
  pyproject: "pyproject.toml"
  lock: "uv.lock" # Generated by `uv sync`

# ── Docker Reproduction (Platform-Managed) ───────────────────────
# The platform provides a GENERIC reproducer image.
# Your submission package is mounted read-only at /submission.
# Do NOT include a Dockerfile — the platform handles everything.
docker:
  # Platform image (pre-installed: Python 3.12, uv, tectonic, numpy, pandas, sklearn, torch)
  platform_image: "automl/reproducer:latest"
  # How the platform runs your paper:
  run: "docker run --rm --network none -v /path/to/your-paper:/submission:ro -v /output:/output automl/reproducer:latest"
  # GPU papers: --gpus all is added automatically based on resources.gpu

# ── Experiments ──────────────────────────────────────────────────
# Genesis demonstrates FIVE research paradigms. When forking,
# keep only the experiment(s) relevant to your paper, or create
# entirely new ones. The contract is simple:
#   INPUT:  seed + command
#   OUTPUT: results.json + declared output files
# That's it. No other constraints. Be creative.
experiments:
  # ── 1. ML Classification (Auto Intelligence) ──
  - name: "iris_classification_demo"
    description: "ML pipeline: load → EDA → train → verify"
    command: "uv run python experiments/run_experiment.py"
    seed: 42
    expected_metrics:
      cv_accuracy_mean:
        value: 0.96
        tolerance: 0.02
      train_accuracy:
        value: 1.0
        tolerance: 0.01
    expected_outputs:
      - "outputs/results.json"
      - "outputs/summary_statistics.csv"
      - "outputs/correlation_matrix.csv"
      - "outputs/figures/fig1_feature_distributions.png"
      - "outputs/figures/fig2_correlation_heatmap.png"
      - "outputs/figures/fig3_confusion_matrix.png"
      - "outputs/figures/fig4_feature_importance.png"

  # ── 2. Statistical Analysis (Auto Science / Life) ──
  - name: "statistical_analysis"
    description: "Hypothesis testing: ANOVA, Kruskal-Wallis, effect sizes"
    command: "uv run python experiments/exp_statistical_analysis.py"
    seed: 42
    expected_metrics:
      anova_p_value:
        value: 0.0
        tolerance: 0.05 # must be significant
      effect_size_eta_sq:
        value: 0.47
        tolerance: 0.10
    expected_outputs:
      - "outputs/statistical/results.json"
      - "outputs/statistical/clinical_data.csv"
      - "outputs/statistical/figures/fig1_boxplot_treatment.png"
      - "outputs/statistical/figures/fig2_confidence_intervals.png"

  # ── 3. Text / Humanities Analysis (Auto Humanities / Society) ──
  - name: "text_analysis"
    description: "Stylometrics: vocabulary richness, sentence structure, authorship"
    command: "uv run python experiments/exp_text_analysis.py"
    seed: 42
    expected_metrics:
      distinctiveness_score:
        value: 0.06
        tolerance: 0.05
    expected_outputs:
      - "outputs/text_analysis/results.json"
      - "outputs/text_analysis/figures/fig1_vocabulary_richness.png"
      - "outputs/text_analysis/figures/fig2_sentence_distribution.png"

  # ── 4. Mathematical Proof (Auto Science — math/theory) ──
  - name: "proof_verification"
    description: "Computational verification: Goldbach, Euler, CLT"
    command: "uv run python experiments/exp_proof_verification.py"
    seed: 42
    expected_metrics:
      goldbach_verified:
        value: 499
        tolerance: 0
    expected_outputs:
      - "outputs/proofs/results.json"
      - "outputs/proofs/figures/fig1_goldbach_decompositions.png"
      - "outputs/proofs/figures/fig2_clt_verification.png"

  # ── 5. Data Exploration (universal — every paper needs EDA) ──
  - name: "data_exploration"
    description: "Comprehensive EDA: profiling, outliers, VIF, correlations"
    command: "uv run python experiments/exp_data_exploration.py"
    seed: 42
    expected_metrics:
      max_vif:
        value: 7.9
        tolerance: 1.0
    expected_outputs:
      - "outputs/data_exploration/results.json"
      - "outputs/data_exploration/statistical_profile.csv"
      - "outputs/data_exploration/correlation_matrix.csv"
      - "outputs/data_exploration/figures/fig1_distributions.png"
      - "outputs/data_exploration/figures/fig2_correlation_heatmap.png"
      - "outputs/data_exploration/figures/fig3_outlier_rates.png"
      - "outputs/data_exploration/figures/fig4_target_relationships.png"

  # ── 6. Economics & Finance (Auto Society) ──
  - name: "financial_analysis"
    description: "Portfolio optimization, VaR/CVaR, econometric tests"
    command: "uv run python experiments/exp_financial_analysis.py"
    seed: 42
    expected_metrics:
      max_sharpe_ratio:
        value: 1.45
        tolerance: 0.50
    expected_outputs:
      - "outputs/finance/results.json"
      - "outputs/finance/price_series.csv"
      - "outputs/finance/daily_returns.csv"
      - "outputs/finance/figures/fig1_cumulative_returns.png"
      - "outputs/finance/figures/fig2_efficient_frontier.png"
      - "outputs/finance/figures/fig3_var_distributions.png"

  # ── 7. Physics Simulation (Auto Science — physics / Engineering) ──
  - name: "physics_simulation"
    description: "N-body gravity, Velocity-Verlet, energy conservation"
    command: "uv run python experiments/exp_physics_simulation.py"
    seed: 42
    expected_metrics:
      energy_drift_max:
        value: 0.0
        tolerance: 0.0001 # < 0.01% drift
    expected_outputs:
      - "outputs/physics/results.json"
      - "outputs/physics/figures/fig1_orbital_trajectories.png"
      - "outputs/physics/figures/fig2_energy_conservation.png"
      - "outputs/physics/figures/fig3_phase_space.png"

# ── Datasets & Models ────────────────────────────────────────────
# Supported sources: r2 | huggingface | modelscope | github | url
# The Reproducer downloads everything into the project workspace.
datasets:
  # ── Built-in dataset (auto-cached to data/iris.csv) ──
  - name: "Iris"
    source: sklearn # Loaded via sklearn.datasets.load_iris()
    identifier: "sklearn.datasets.load_iris"
    local_path: "data/iris.csv" # Auto-cached after first run
    format: "csv"
    size: "~7KB"
    license: "CC0 (Public Domain)"
    description: "Fisher's Iris dataset (150 samples, 4 features, 3 classes)"

  # ── Example: HuggingFace dataset ──
  # - name: "CIFAR-10"
  #   source: huggingface
  #   repo_id: "uoft-cs/cifar10"
  #   filename: "cifar10.tar.gz"          # specific file, or omit for full repo
  #   revision: "main"
  #   sha256: "abcd1234..."
  #   local_path: "data/cifar10/"
  #   size: "~170MB"
  #   license: "MIT"

  # ── Example: ModelScope model ──
  # - name: "Qwen3-0.6B"
  #   source: modelscope
  #   repo_id: "Qwen/Qwen3-0.6B"
  #   local_path: "models/qwen3-0.6b/"
  #   size: "~1.2GB"
  #   license: "Apache-2.0"

  # ── Example: GitHub release asset ──
  # - name: "pretrained-weights"
  #   source: github
  #   repo: "org/project"
  #   tag: "v1.0"
  #   asset: "model_weights.pt"
  #   sha256: "ef56..."
  #   local_path: "weights/model.pt"

  # ── Example: Direct URL ──
  # - name: "Custom CSV"
  #   source: url
  #   url: "https://example.com/data.csv"
  #   sha256: "7890..."
  #   local_path: "data/custom.csv"

# ── Resource Tier ────────────────────────────────────────────────
resources:
  tier: "Nano" # No GPU required
  gpu: false
  estimated_time: "< 30 seconds"
  disk: "< 50 MB"

# ── Artifact Storage (R2 + Public CDN) ───────────────────────────
# Paper, code, and data stored separately on Cloudflare R2.
# Public CDN domain: artifacts.auto.ml
storage:
  cdn_domain: "artifacts.auto.ml" # R2 custom domain (public)
  paper_prefix: "papers/GENESIS-001" # r2 key prefix
  code_prefix: "code/GENESIS-001"
  data_prefix: "data/" # shared across papers (dedup by sha256)

# ── Paper Compilation ────────────────────────────────────────────
paper:
  source: "genesis-paper.tex"
  compiler: "pdflatex"
  compile_command: "latexmk -pdf genesis-paper.tex"

# ── Reference Evidence ───────────────────────────────────────────
references:
  manifest: "refs/refs-manifest.yaml"
  total: 30
  coverage_target: 0.90 # ≥90% must have evidence files

# ── Telemetry (Auto-Upload After Reproduction) ──────────────────
# All stage timings, pass/fail counts, and author info are
# automatically uploaded to the platform API after the pipeline runs.
# The user's API key authenticates the upload.
telemetry:
  enabled: true
  endpoint: "https://auto.ml/api/telemetry/reproduction"
  api_key: "${AUTOML_API_KEY}" # from env var or set directly
  # Uploaded payload includes:
  #   - paper_id, title, authors (from metadata above)
  #   - per-stage timings (ms): Validate, Audit, Sandbox, Download,
  #     Install, Experiments, Compile, Verify, Export
  #   - stages_passed, stages_failed, status (PASSED/FAILED)
  #   - output file list

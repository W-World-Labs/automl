[project]
name = "wifi-csi-har"
version = "1.0.0"
description = "CSIFormer: Lightweight Transformer-based Human Activity Recognition from WiFi Channel State Information"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "CC-BY-4.0" }

authors = [
    { name = "W Intelligence Lab", email = "team@auto.ml" },
]

dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "torch>=2.2",
    "tqdm>=4.66",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["experiments"]

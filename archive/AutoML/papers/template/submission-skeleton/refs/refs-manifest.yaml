# Auto requires authors to provide verifiable source material
# for EVERY cited reference. This manifest maps BibTeX keys to
# their evidence files.
#
# Accepted evidence types (in order of preference):
#   1. Original PDF      — publisher or preprint server
#   2. HTML snapshot     — for web-only resources
#   3. Archive link      — Wayback Machine URL
#
# Coverage requirement: ≥90% of cited references must have evidence.
# The Reproducer checks this automatically.
#
# Filename convention: <bibtex_key>.pdf or <bibtex_key>.html
# ═══════════════════════════════════════════════════════════════════


[project]
name = "openbb-001"
version = "1.0.0"
description = "OpenBB: A Modular Multi-Modal LLM Training Framework with YOLO-Style Auto-Adaptive Configuration"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }

authors = [
    { name = "W Intelligence Lab", email = "team@auto.ml" },
]

# Core dependencies for experiments
dependencies = [
    "torch>=2.5",
    "transformers>=4.46",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["experiments"]

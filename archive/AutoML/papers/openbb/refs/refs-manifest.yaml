# Auto.ml requires authors to provide verifiable source material
# for EVERY cited reference. This manifest maps BibTeX keys to
# their evidence files.
#
# Accepted evidence types (in order of preference):
#   1. Original PDF      — publisher or preprint PDF
#   2. HTML snapshot      — saved webpage (.html or .mhtml)
#   3. Screenshot         — visible proof of publication (.png)
#   4. DOI landing page   — saved as PDF or HTML
#   5. Any document       — Word, EPUB, etc.
#
# Directory structure:
#   refs/
#   ├── refs-manifest.yaml    (this file)
#   ├── sakana2025scientist.pdf
#   ├── baker2016reproducibility.pdf
#   ├── vaswani2017attention.pdf
#   └── ...
#
# Naming convention: {bibtex_key}.{ext}
# ═══════════════════════════════════════════════════════════════


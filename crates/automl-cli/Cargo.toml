[package]
name = "automl-cli"
description = "Auto.ml command-line client"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "automl"
path = "src/main.rs"

[dependencies]
automl-core.workspace = true

anyhow.workspace = true
clap.workspace = true
serde_json.workspace = true
reqwest = { workspace = true, features = ["blocking"] }
rustls.workspace = true
w-http.workspace = true
w-crypto = { workspace = true, default-features = false, features = ["hash", "hex"] }
w-util.workspace = true
ed25519-dalek.workspace = true
rand.workspace = true
base64.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
axum.workspace = true
w-id-sdk.workspace = true
w-crypto = { workspace = true, default-features = false, features = ["hash", "hex", "hmac"] }
uuid.workspace = true
reqwest = { workspace = true, features = ["json"] }
sqlx.workspace = true

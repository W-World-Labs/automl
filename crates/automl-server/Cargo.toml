[package]
name = "automl-server"
description = "Auto.ml API server — Axum + PostgreSQL, OpenAPI generated from code"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "automl_server"
path = "src/lib.rs"

[[bin]]
name = "automl-server"
path = "src/main.rs"

[dependencies]
automl-core.workspace = true

axum.workspace = true
axum-extra.workspace = true
tokio.workspace = true
tower.workspace = true
tower-http.workspace = true
tower_governor.workspace = true
governor.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
chrono.workspace = true
uuid.workspace = true
rand.workspace = true
base64.workspace = true
http.workspace = true
tracing.workspace = true
anyhow.workspace = true
thiserror.workspace = true
dotenvy.workspace = true
utoipa.workspace = true
utoipa-axum.workspace = true

w-web-kit.workspace = true
w-crypto.workspace = true
w-http.workspace = true
reqwest.workspace = true
rustls.workspace = true
w-task.workspace = true
w-id-axum.workspace = true
w-id-sdk.workspace = true
w-storage.workspace = true
xradar.workspace = true
rust-embed = { version = "8", features = ["include-exclude"] }
bytes = "1"
ed25519-dalek.workspace = true

[dev-dependencies]
tower = { workspace = true, features = ["util"] }
http-body-util = "0.1"
tempfile = "3"
